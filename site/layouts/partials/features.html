<section class="features">
  <div class="container">

    <div class="features-grid" style="display:flex; justify-content:space-between; gap:20px; flex-wrap:wrap;">
      {{ range .features.items }}
        <div class="feature-item" style="flex:1 1 30%; text-align:center;">
          <img src="{{ .image }}" alt="" style="width:100%; max-width:200px; height:auto; display:block; margin:0 auto 10px;">
          <p>{{ .text }}</p>
        </div>
      {{ end }}
    </div>

    {{ with .blurb.buttons }}
      <div class="features-button" style="text-align:center; margin-top:30px;">
        {{ range . }}
          <a href="{{ .link }}" class="btn" style="padding:10px 20px; background:#ff6600; color:#fff; text-decoration:none; border-radius:5px;">
            {{ .label }}
          </a>
        {{ end }}
      </div>
    {{ end }}

  </div>
</section>
